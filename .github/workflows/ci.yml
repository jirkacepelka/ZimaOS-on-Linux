name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o dist/zima-connect ./cmd/zima-connect

      - name: Test (race)
        run: go test -race ./...

  metadata:
    name: Validate Flatpak metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream

      - name: Validate desktop entry
        run: desktop-file-validate packaging/flatpak/io.github.jirkacepelka.ZimaConnect.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packaging/flatpak/io.github.jirkacepelka.ZimaConnect.metainfo.xml

name: Flatpak

# Builds the actual Flatpak from the manifest: this compiles libzt from source
# and links the app with -tags libzt, exactly as a Flathub build would. The
# resulting .flatpak bundle is uploaded as a workflow artifact you can install
# on any distro that has flatpak (Bazzite, Silverblue, Ubuntu, ...):
#
#   flatpak install --user zima-connect.flatpak
#   flatpak run io.github.jirkacepelka.ZimaConnect

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: zima-connect.flatpak
          manifest-path: packaging/flatpak/io.github.jirkacepelka.ZimaConnect.yml
          cache-key: flatpak-builder-${{ github.sha }}

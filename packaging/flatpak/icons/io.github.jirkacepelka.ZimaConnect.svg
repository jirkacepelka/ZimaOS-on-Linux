<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- Central node -->
  <circle cx="64" cy="64" r="13" fill="#ffffff"/>
  <!-- Orbiting nodes (a small mesh network) -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="64" cy="24" r="8"/>
    <circle cx="99" cy="84" r="8"/>
    <circle cx="29" cy="84" r="8"/>
  </g>
  <!-- Links -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="64" y1="64" x2="64" y2="24"/>
    <line x1="64" y1="64" x2="99" y2="84"/>
    <line x1="64" y1="64" x2="29" y2="84"/>
  </g>
</svg>
